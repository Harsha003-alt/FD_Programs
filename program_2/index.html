<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; display: flex; min-height: 100vh; }
    .sidebar { width: 200px; background-color: #333; color: white; padding: 20px; }
    .sidebar h2 { margin-top: 0; }
    .sidebar a { display: block; color: white; text-decoration: none; padding: 10px 0; }
    .sidebar a:hover { background-color: #575757; padding-left: 5px; }
    .main-container { flex: 1; display: flex; flex-direction: column; }
    .content { flex: 1; padding: 30px; }
    footer { background-color: #eee; text-align: center; padding: 10px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Sidebar</h2>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <div class="main-container">
    <div class="content">
      <h1>My Website</h1>
      <p>Welcome to the content area</p>
    </div>
    <footer>
      <p>&copy; 2026 My Website</p>
    </footer>
  </div>

</body>
</html>
