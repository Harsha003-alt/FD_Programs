<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Demo || Program 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>My Website</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <div class="container">
      <aside class="sidebar">
        <ul>
          <li>Dashboard</li>
          <li>Profile</li>
          <li>Settings</li>
          <li>Logout</li>
        </ul>
      </aside>

      <main class="content">
        <h2>Welcome</h2>

        <p>
          This layout uses CSS Grid for the overall page structure and Flexbox
          for navigation and card alignment.
        </p>

        <div class="cards">
          <div class="card">Card 1</div>
          <div class="card">Card 2</div>
          <div class="card">Card 3</div>
        </div>
      </main>
    </div>

    <footer>
      <p>&copy; 2026 Flexbox &amp; Grid Demo</p>
    </footer>
  </body>
</html>
