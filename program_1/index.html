<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Annual College Event 2026</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
    header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
    nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
    section { padding: 20px; margin: 20px; background: white; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #eee; }
    footer { background-color: #2c3e50; color: white; text-align: center; padding: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>Annual College Event 2026</h1>
    <nav>
      <a href="#welcome">Home</a>
      <a href="#schedule">Schedule</a>
      <a href="#speakers">Speaker</a>
    </nav>
  </header>

  <section id="welcome">
    <h2>Welcome</h2>
    <p>Welcome to our Annual College Event.</p>
  </section>

  <section id="schedule">
    <h2>Event Schedule</h2>
    <table>
      <tr>
        <th>Time</th>
        <th>Event</th>
      </tr>
      <tr>
        <td>10:00AM</td>
        <td>Inauguration</td>
      </tr>
      <tr>
        <td>11:00AM</td>
        <td>Guest Speech</td>
      </tr>
      <tr>
        <td>12:00PM</td>
        <td>Cultural Program</td>
      </tr>
    </table>
  </section>

  <section id="speakers">
    <h2>Speakers</h2>
    <p><strong>Dr. Ravi Kumar</strong><br>Chief Guest and Motivational Speaker</p>
  </section>

  <footer>
    <p>&copy; 2026 RPA First Grade College</p>
  </footer>

</body>
</html>
